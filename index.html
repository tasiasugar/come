<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasia Sugar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-pink: #ff006e;
      --neon-cyan: #00f5ff;
      --neon-yellow: #ffee00;
      --dark: #060608;
      --dark2: #0d0d12;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Syne', sans-serif;
      color: #fff;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--neon-cyan);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width .15s, height .15s, background .15s;
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: fixed;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid var(--neon-pink);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform .08s ease-out, width .2s, height .2s, border-color .2s;
    }
    body:has(a:hover) .cursor { width: 20px; height: 20px; background: var(--neon-yellow); }
    body:has(a:hover) .cursor-ring { width: 56px; height: 56px; border-color: var(--neon-yellow); }

    /* ── Media collage background ── */
    .collage {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      z-index: 0;
    }

    .collage-item {
      overflow: hidden;
      position: relative;
    }

    .collage-item img,
    .collage-item video {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(1.1) contrast(1.05);
      transition: transform 8s ease-in-out;
    }

    /* Ken Burns slow zoom on images */
    @keyframes kenburns {
      0%   { transform: scale(1) translate(0,0); }
      50%  { transform: scale(1.08) translate(-1%, 1%); }
      100% { transform: scale(1) translate(0,0); }
    }
    .collage-item:nth-child(odd) img  { animation: kenburns 14s ease-in-out infinite alternate; }
    .collage-item:nth-child(even) img { animation: kenburns 18s ease-in-out infinite alternate-reverse; }

    /* Chromatic glitch on hover */
    .collage-item:hover img,
    .collage-item:hover video {
      filter: saturate(1.6) contrast(1.2) hue-rotate(10deg);
    }

    /* ── Dark overlay with texture ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,.08) 2px,
          rgba(0,0,0,.08) 4px
        ),
        linear-gradient(160deg,
          rgba(6,6,8,.82) 0%,
          rgba(6,6,8,.55) 50%,
          rgba(6,6,8,.85) 100%
        );
    }

    /* Neon grid lines */
    .grid-lines {
      position: fixed;
      inset: 0;
      z-index: 2;
      background-image:
        linear-gradient(rgba(0,245,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    /* ── Main content ── */
    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 2rem;
    }

    /* Glitch text effect */
    @keyframes glitch1 {
      0%,95%,100% { clip-path: none; transform: translate(0); }
      96% { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translate(-4px, 2px); }
      97% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translate(4px, -2px); }
      98% { clip-path: none; transform: translate(0); }
    }
    @keyframes glitch2 {
      0%,96%,100% { clip-path: none; transform: translate(0); opacity: 0; }
      97% { clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%); transform: translate(6px,-1px); opacity:.7; color: var(--neon-cyan); }
      99% { opacity: 0; }
    }

    .name-wrap {
      position: relative;
      text-align: center;
      margin-bottom: 0.2em;
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) .1s both;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 14vw, 13rem);
      line-height: .9;
      letter-spacing: .04em;
      color: #fff;
      text-shadow:
        0 0 20px rgba(255,0,110,.6),
        0 0 60px rgba(255,0,110,.3),
        2px 2px 0 var(--neon-pink);
      animation: glitch1 7s infinite;
      position: relative;
      z-index: 1;
    }

    .name::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      animation: glitch2 7s infinite .05s;
      z-index: 2;
    }

    .bio {
      font-size: clamp(.85rem, 2.2vw, 1.1rem);
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      text-shadow: 0 0 14px rgba(0,245,255,.7);
      text-align: center;
      margin-bottom: 2.8rem;
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) .3s both;
    }

    /* ── Social buttons ── */
    .socials {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp .9s cubic-bezier(.16,1,.3,1) .5s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .85rem 2.2rem;
      font-family: 'Syne', sans-serif;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
      color: #fff;
      border: 2px solid currentColor;
      overflow: hidden;
      transition: color .25s, transform .2s, box-shadow .25s;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      transform: translateX(-102%);
      transition: transform .3s cubic-bezier(.16,1,.3,1);
      z-index: -1;
    }
    .btn:hover::before { transform: translateX(0); }
    .btn:hover { transform: translateY(-3px) scale(1.04); }

    /* Fanvue — pink */
    .btn-fanvue {
      color: var(--neon-pink);
      box-shadow: 0 0 18px rgba(255,0,110,.3), inset 0 0 18px rgba(255,0,110,.05);
    }
    .btn-fanvue::before { background: var(--neon-pink); }
    .btn-fanvue:hover {
      color: #000;
      box-shadow: 0 0 40px rgba(255,0,110,.7), 0 0 80px rgba(255,0,110,.3);
    }

    /* Telegram — cyan */
    .btn-telegram {
      color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(0,245,255,.3), inset 0 0 18px rgba(0,245,255,.05);
    }
    .btn-telegram::before { background: var(--neon-cyan); }
    .btn-telegram:hover {
      color: #000;
      box-shadow: 0 0 40px rgba(0,245,255,.7), 0 0 80px rgba(0,245,255,.3);
    }

    .btn-icon { font-size: 1.2em; line-height: 1; flex-shrink: 0; }

    /* ── Scanline flicker ── */
    @keyframes flicker {
      0%,100% { opacity: .03; }
      50% { opacity: .06; }
    }
    .scanline {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 3px,
        rgba(255,255,255,.015) 3px,
        rgba(255,255,255,.015) 4px
      );
      pointer-events: none;
      animation: flicker 3s ease-in-out infinite;
    }

    /* ── Corner decorations ── */
    .corner {
      position: fixed;
      width: 50px; height: 50px;
      z-index: 15;
      pointer-events: none;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }
    .corner::before { width: 2px; height: 30px; }
    .corner::after  { width: 30px; height: 2px; }
    .corner-tl { top: 20px; left: 20px; }
    .corner-tl::before { top:0; left:0; }
    .corner-tl::after  { top:0; left:0; }
    .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner-tr::before { top:0; left:0; }
    .corner-tr::after  { top:0; left:0; }
    .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner-bl::before { top:0; left:0; }
    .corner-bl::after  { top:0; left:0; }
    .corner-br { bottom: 20px; right: 20px; transform: scale(-1); }
    .corner-br::before { top:0; left:0; }
    .corner-br::after  { top:0; left:0; }

    /* Pulse dot */
    @keyframes pulse-dot {
      0%,100% { transform: scale(1); opacity:1; }
      50% { transform: scale(1.6); opacity:.5; }
    }
    .live-dot {
      position: fixed;
      bottom: 26px; right: 26px;
      z-index: 16;
      display: flex; align-items: center; gap: .5rem;
      font-size: .65rem; letter-spacing: .2em; text-transform: uppercase;
      color: var(--neon-pink);
      pointer-events: none;
    }
    .live-dot span {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--neon-pink);
      box-shadow: 0 0 10px var(--neon-pink);
      animation: pulse-dot 1.4s ease-in-out infinite;
    }

    /* ── Placeholder cells info ── */
    .placeholder-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      background: rgba(6,6,8,.55);
      color: rgba(255,255,255,.35);
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .placeholder-label svg { width: 28px; height: 28px; opacity:.4; }

    /* Responsive */
    @media (max-width: 600px) {
      .collage { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
      .btn { padding: .75rem 1.6rem; font-size: .85rem; }
    }
  </style>
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cur"></div>
  <div class="cursor-ring" id="curRing"></div>

  <!-- ══ MEDIA COLLAGE — замените src на свои файлы ══ -->
  <div class="collage">

    <!-- Ячейка 1: фото -->
    <div class="collage-item">
      <img src="media/1.png" alt="" />
    </div>

    <!-- Ячейка 2: видео -->
    <div class="collage-item">
      <video autoplay muted loop playsinline>
        <source src="media/video_2026-05-01_22-24-51.mp4?v=2" type="video/mp4" />
      </video>
    </div>

    <!-- Ячейка 3: фото -->
    <div class="collage-item">
      <img src="media/2.jpg" alt="" />
    </div>

    <!-- Ячейка 4: фото -->
    <div class="collage-item">
      <img src="media/3.jpg" alt="" />
    </div>

    <!-- Ячейка 5: видео -->
    <div class="collage-item">
      <video autoplay muted loop playsinline>
        <source src="media/IMG_9452.mp4?v=2" type="video/mp4" />
      </video>
    </div>

    <div class="collage-item">
      <img src="media/4.jpg" alt="" />
    </div>

    <div class="collage-item">
      <img src="media/5.jpg" alt="" />
    </div>

    <div class="collage-item">
      <img src="media/6.jpg" alt="" />
    </div>

  </div>
  <!-- ════════════════════════════════════════════════ -->

  <div class="overlay"></div>
  <div class="grid-lines"></div>
  <div class="scanline"></div>

  <!-- Corner decorations -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Live indicator -->
  <div class="live-dot"><span></span> Live</div>

  <!-- ══ MAIN CONTENT ══ -->
  <main class="stage">

    <div class="name-wrap">
      <!-- ✏️ Замените YOUR NAME на своё имя/псевдоним -->
      <h1 class="name" data-text="Tasia Sugar">Tasia Sugar</h1>
    </div>

    <!-- ✏️ Ваше bio / описание -->
    <p class="bio">✦ Creator &nbsp;·&nbsp; Model &nbsp;·&nbsp; Sponsor of your leisure time ✦</p>

    <div class="socials">

      <!-- ✏️ Замените # на ваши ссылки -->
      <a href="https://t.me/sugartasia" target="_blank" rel="noopener" class="btn btn-fanvue">
        <span class="btn-icon">
          <!-- Fanvue icon (simplified F) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v3H9v4h10v3H9v8H6V3z"/><path d="M14 10h6v3h-6z" opacity=".6"/></svg>
        </span>
        Fanvue
      </a>

      <a href="https://t.me/sugartasia" target="_blank" rel="noopener" class="btn btn-telegram">
        <span class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.941z"/></svg>
        </span>
        Telegram
      </a>

    </div>
  </main>

  <script>
    // Custom cursor
    const cur = document.getElementById('cur');
    const ring = document.getElementById('curRing');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
    (function animCursor() {
      cur.style.left = mx + 'px'; cur.style.top = my + 'px';
      rx += (mx - rx) * .12; ry += (my - ry) * .12;
      ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
      requestAnimationFrame(animCursor);
    })();

    // Hide video placeholder when video loads
    document.querySelectorAll('video').forEach(v => {
      v.addEventListener('loadeddata', () => {
        const lbl = v.nextElementSibling;
        if (lbl && lbl.classList.contains('placeholder-label')) lbl.style.display = 'none';
      });
    });
  </script>
</body>
</html>
